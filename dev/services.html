<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2A1F4A" />
  <title>Pixel Purr · services lab</title>
  <style>
    :root { --ink: #24193F; --cream: #FBF6FF; --muted: #BFAEE6; --gold: #FFC93B; --panel: #2E2368; --panel2: #3A2D86; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; color: var(--cream); user-select: none; -webkit-user-select: none; }
    html { background: #231A4F; }
    body { background: linear-gradient(#4A3A96, #33276F 45%, #231A4F) fixed; font: 800 13px/1.25 'Nunito', system-ui, sans-serif;
      padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px); }
    main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1 { margin: 0; font: 400 30px/1 'Lilita One', sans-serif; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
    .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .chip { font: 400 13px 'Lilita One', sans-serif; padding: 6px 12px; border-radius: 99px; background: #1C1540; border: 2.5px solid var(--ink); color: var(--gold); white-space: nowrap; }
    section { background: linear-gradient(var(--panel2), var(--panel)); border: 3px solid var(--ink); border-radius: 20px; padding: 10px 12px 12px;
      box-shadow: 0 4px 0 var(--ink), inset 0 2px 0 rgba(255,255,255,.12); }
    h2 { margin: 0 0 8px; font: 400 15px 'Lilita One', sans-serif; color: var(--gold); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
      display: flex; justify-content: space-between; align-items: baseline; }
    h2 small { font: 800 11px 'Nunito', sans-serif; color: var(--muted); -webkit-text-stroke: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    .row + .row { margin-top: 8px; }
    button { font: 900 13px 'Nunito', sans-serif; color: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 7px 11px;
      background: linear-gradient(#6B5BD0, #4E3FAE); box-shadow: 0 3px 0 var(--ink), inset 0 2px 0 rgba(255,255,255,.18); cursor: pointer;
      transition: transform .15s cubic-bezier(.2,.8,.3,1.4); }
    button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
    button.go { background: linear-gradient(#7EE07A, #3DAA4A); }
    button.blue { background: linear-gradient(#5AA2FF, #2D63D8); }
    button.pink { background: linear-gradient(#FF7EC8, #D6449A); }
    button.on { background: linear-gradient(#FFE066, #E08A12); }
    button[disabled] { opacity: .45; }
    .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .item { background: rgba(28, 21, 64, .55); border-radius: 12px; padding: 7px 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .item b { display: block; font: 400 14px 'Lilita One', sans-serif; }
    .item i { display: block; font-style: normal; color: var(--muted); font-size: 10px; }
    .item.owned { outline: 2px dashed var(--gold); }
    pre { margin: 0; max-height: 150px; overflow: auto; font: 600 10px/1.35 ui-monospace, Menlo, monospace; color: #E2D9FF;
      background: rgba(28, 21, 64, .55); border-radius: 12px; padding: 8px; white-space: pre-wrap; word-break: break-all; user-select: text; }
    #log { color: var(--muted); font-size: 11px; min-height: 14px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Services lab</h1><div class="sub">Pixel Purr · ads, store, remote config, platform</div></div>
      <span class="chip" id="os">web</span>
    </header>
    <section><h2>Ads <small id="adState">…</small></h2><div id="ads"></div></section>
    <section><h2>Store <small id="storeState">…</small></h2><div class="shop" id="shop"></div><div id="store"></div></section>
    <section><h2>Remote config <small id="rcState">…</small></h2><pre id="rc"></pre></section>
    <section><h2>Platform &amp; analytics <small id="platState">…</small></h2><div id="plat"></div><pre id="events" style="margin-top:8px"></pre></section>
    <div id="log"></div>
  </main>
  <script type="module" src="../src/services/dev.ts"></script>
</body>
</html>
