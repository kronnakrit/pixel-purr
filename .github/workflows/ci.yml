name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iOS app (macOS runner, uses more Actions minutes)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist, retention-days: 7 }

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx vite build && npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      # Debug APK to sideload on a test phone (Phase 0: check performance on a cheap Android).
      - uses: actions/upload-artifact@v4
        with: { name: pixel-purr-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 14 }

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build && npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        working-directory: ios/App
        run: xcodebuild -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
